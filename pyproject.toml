[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "PyPeCT2S"
version = "1.1.0"
description = "A GUI built to provide a contained base for the automation of the CT2S pipeline. With a specific focus on paediatric applications. Utilising ANSYS and other FEM solver tools."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "George Allison", email = "ghallison1@sheffield.ac.uk"}
]
requires-python = "==3.13.*"
dependencies = [
    "ansys-dpf-post==0.12",
    "ansys-mapdl-core==0.74.1",
    "numpy-stl==4.0.1",
    "pyqt6==6.*",
    "scikit-learn==1.9.1",
    "trimesh==5.1.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.7",
  "mypy==2.3.1",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.urls]
"Source Code" = "github.com/INSIGNEO/PyPeCT2S"

[project.scripts]
pypect2s = "PyPeCT2S:main"

[tool.hatch.build.targets.wheel]
packages = ["core_libs", "fem_libs", "material_libs", "mesh_libs", "post_libs"]

[tool.hatch.build.targets.sdist]
include = [
  "/PyPeCT2S.py",
  "/core_libs",
  "/fem_libs",
  "/material_libs",
  "/mesh_libs",
  "/post_libs",
  "/README.md",
  "/LICENSE",
]
